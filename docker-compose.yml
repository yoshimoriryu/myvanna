version: '3.8'

services:
  # --- PRIVATE DATA ENVIRONMENT (FOR LOCAL DEV & TESTING ONLY) ---
  # In a real production environment, this database and the secure_api would
  # be deployed in a separate, trusted network (e.g., a private VPC).
  # It is included here to provide a complete, one-command setup for
  # local development and integration testing.
  private-data-db:
    image: postgres:17
    container_name: myvanna-private-data-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - private_db_data:/var/lib/postgresql/data
    # restart: unless-stopped
    networks:
      - private_secure_api

  secure-api:
    build:
      context: .
      dockerfile: src/chatbot/Dockerfile
    volumes:
    - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=private-data-db
      - POSTGRES_PORT=5432
    depends_on:
      - private-data-db
    networks:
      - private_secure_api
      - myvanna_network
    command: uvicorn secure_api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  # --- CHATBOT APPLICATION ENVIRONMENT ---
  # This database stores the application's state, such as conversation histories.
  chatbot-state-db:
    image: postgres:17
    container_name: myvanna-chatbot-state-db
    environment:
      POSTGRES_USER: ${CHATBOT_DB_USER}
      POSTGRES_PASSWORD: ${CHATBOT_DB_PASSWORD}
      POSTGRES_DB: ${CHATBOT_DB_NAME}
    ports:
      - "${CHATBOT_DB_PORT}:5432"
    volumes:
      - chatbot_db_data:/var/lib/postgresql/data
    # restart: unless-stopped
    networks:
      - myvanna_network

  qdrant:
    image: qdrant/qdrant
    container_name: myvanna-qdrant
    ports:
      - "${QDRANT_PORT}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_data:/qdrant/storage
    # restart: unless-stopped
    networks:
      - myvanna_network

  chatbot-api:
    build:
      context: .
      dockerfile: src/chatbot/Dockerfile
    volumes:
    - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - POSTGRES_USER={CHATBOT_DB_USER}
      - POSTGRES_PASSWORD={CHATBOT_DB_PASSWORD}
      - POSTGRES_DB={CHATBOT_DB_NAME}
      - POSTGRES_HOST=chatbot-state-db
      - POSTGRES_PORT=5432
    depends_on:
      - chatbot-state-db
    networks:
      - myvanna_network
    command: uvicorn src.chatbot.run_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

volumes:
  private_db_data:
  chatbot_db_data:
  qdrant_data:

networks:
  myvanna_network:
    driver: bridge
  private_secure_api:
    driver: bridge